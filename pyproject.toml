[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightops-portfolio"
version = "0.1.0"
description = "Reproducible commerce analytics, experiment diagnostics and evidence-first workflow evaluation"
requires-python = ">=3.11"
dependencies = ["scipy>=1.11,<2"]

[project.optional-dependencies]
mongo = ["pymongo>=4.6,<5"]
dev = ["pytest>=8,<10"]

[project.scripts]
insightops = "insightops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
