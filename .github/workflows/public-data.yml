name: public-data-reproduction
on:
  workflow_dispatch:
jobs:
  uci-retail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[real-data]'
      - run: insightops real-data --download
      - uses: actions/upload-artifact@v4
        with:
          name: uci-retail-derived-report
          path: artifacts/real-data/
