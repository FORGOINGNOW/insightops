name: reproducibility
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/replay_scores.py
      - run: insightops challenge-eval
      - run: insightops demo
      - uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          path: artifacts/
  mongo-reconcile:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[mongo]'
      - run: insightops demo --per-period 1000
      - run: python mongo/benchmark.py --copies 1 --repeats 3
      - uses: actions/upload-artifact@v4
        with:
          name: mongo-reconciliation
          path: artifacts/mongo-benchmark.json
